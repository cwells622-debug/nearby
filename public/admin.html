<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ChadAds Admin</title>
<style>
:root{--bg:#fbf7ef;--panel:#fffdf8;--ink:#1e1c19;--mute:#6d6558;--line:#e8dfcc;--acc:#e95e0d;--acc-ink:#1e1c19;--link:#164663;--soft:#f3eadb;--danger:#c4001a}
@media (prefers-color-scheme:dark){:root{--bg:#15120e;--panel:#201c16;--ink:#f6e9d2;--mute:#a99f8d;--line:#3b342a;--acc:#f26a1b;--acc-ink:#1a120a;--link:#7fb6dc;--soft:#2b261e;--danger:#ff6961}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:3;flex-wrap:wrap}
header h1{margin:0;font-size:20px;letter-spacing:-.02em}
header .r{display:flex;gap:10px;align-items:center;color:var(--mute);font-size:14px}
a{color:var(--link)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:999px;padding:9px 18px;white-space:nowrap}
.btn.ghost{background:var(--soft);color:var(--ink)}
.btn.danger{background:var(--danger);color:#fff}
.btn.sm{padding:6px 13px;font-size:14px}
main{max-width:1200px;margin:0 auto;padding:18px 20px 60px}
.msg{padding:48px 20px;text-align:center;color:var(--mute);background:var(--soft);border-radius:20px}
.msg h2{color:var(--ink);margin:0 0 6px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.filters input,.filters select{border:0;background:var(--soft);border-radius:12px;padding:10px 12px}
.filters input[type=search]{flex:1;min-width:180px}
.wrapx{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;min-width:820px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);font-weight:600;background:var(--soft)}
tr:last-child td{border-bottom:0}
.th img,.th span{width:48px;height:48px;border-radius:10px;object-fit:cover;background:var(--soft);display:grid;place-items:center;font-size:12px;color:var(--mute)}
.ttl{font-weight:600;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub{color:var(--mute);font-size:13px}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;background:var(--soft)}
.pill.sold{background:var(--ink);color:var(--bg)}
.pill.demo{border:1px solid var(--line);background:none;color:var(--mute)}
.acts{display:flex;gap:6px;justify-content:flex-end}
.more{text-align:center;margin-top:16px}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.rep{border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.rep h3{margin:0 0 4px;font-size:16px}
.rep ul{margin:8px 0 10px;padding-left:18px}
.rep li{margin:3px 0}
dialog{border:0;border-radius:24px;padding:0;width:min(600px,94vw);max-height:92vh;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(0,0,0,.4)}
form.dlg,.dlg{padding:22px;display:flex;flex-direction:column;gap:12px}
.dlg .top{display:flex;justify-content:space-between;align-items:center}
.dlg h2{margin:0;font-size:20px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;color:var(--mute)}
label{display:flex;flex-direction:column;gap:5px;font-weight:500;font-size:14px;color:var(--mute)}
label input,label select,label textarea{border:1px solid transparent;background:var(--soft);border-radius:12px;padding:11px;font-weight:400;color:var(--ink)}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--acc)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.thumbs{display:flex;gap:10px;flex-wrap:wrap}
.thumbs label{align-items:center;font-size:12px;gap:3px}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:12px;display:block}
.err{color:var(--danger);margin:0;font-size:14px}
.ok{background:var(--soft);padding:10px 14px;border-radius:12px}
.login{max-width:380px;margin:40px auto;display:flex;flex-direction:column;gap:12px}
@media (max-width:600px){main{padding:14px}.row{grid-template-columns:1fr}}
</style>
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/android-chrome-192x192.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
</head>
<body>
<header>
  <h1>ChadAds Admin</h1>
  <div class="r"><span id="who"></span><a href="./">View site</a><button class="btn ghost sm" id="out" hidden>Log out</button></div>
</header>
<main id="main"><p class="msg">Loading…</p></main>

<dialog id="dEdit"><form class="dlg" id="fe">
  <div class="top"><h2 id="eTitle">Edit ad</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
  <label>Title<input name="t" required maxlength="60"></label>
  <div class="row">
    <label>Category<select name="c" id="ec"></select></label>
    <label>Price ($, 0 for free)<input name="p" type="number" min="0" required></label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="por" id="epor" style="width:auto;padding:0;margin:0"> Call for price</label>
  </div>
  <div class="row">
    <label>City<input name="loc" id="el" list="cl" required autocomplete="off"></label>
    <label>Status<select name="s"><option value="active">Active (visible)</option><option value="sold">Sold (hidden from public)</option><option value="hidden">Hidden (no pictures yet)</option></select></label>
    <label>Make (Auto Cars / Trucks / SUVs; leave empty to fill it from the title)<input name="make" maxlength="30" autocomplete="off"></label>
    <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" name="ft" id="eft" style="width:auto;padding:0;margin:0"> Featured ad (premium placement: shown first, with a Featured badge)</label>
  </div>
  <datalist id="cl"></datalist>
  <label>Description<textarea name="d" rows="4" required maxlength="2000"></textarea></label>
  <label>Link (cars and trucks only)<input name="link" type="url" maxlength="500" placeholder="https://"></label>
  <label>Video link (YouTube or Vimeo)<input name="vlink" type="url" maxlength="200" placeholder="https://www.youtube.com/watch?v=..."></label>
  <label id="eVidRow" style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)" hidden><input type="checkbox" name="rmv"> Remove the uploaded video file</label>
  <div id="ePhotos" class="thumbs"></div>
  <p class="err" id="eErr" role="alert"></p>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <button class="btn" type="submit" id="eGo">Save changes</button>
    <button class="btn danger" type="button" id="eDel">Delete this ad</button>
  </div>
</form></dialog>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
/* ChadAds admin page.
   Safety: this page is only a convenient screen. What admins can actually do is decided by the
   database rules in step8_admin.sql (is_admin()). A non-admin who opens this page sees nothing. */
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const BUCKET="listing-photos",VBUCKET="listing-videos",PAGE=50;
const VIDEO_LINK_OK=/^https:\/\/(www\.|m\.)?(youtube\.com\/(watch\?v=|shorts\/|embed\/)|youtu\.be\/|vimeo\.com\/)[A-Za-z0-9_?=&\/.-]+$/i;
let sb=null,rows=[],cats=[],cityIds={},cityNames={},citiesLoaded=false,from=0,more=false,editing=null,busy=false;
const ok=typeof NEARBY_CONFIG!=="undefined"&&/^https?:\/\//.test(NEARBY_CONFIG.supabaseUrl)&&!NEARBY_CONFIG.supabaseAnonKey.startsWith("PASTE");
if(ok&&window.supabase)sb=window.supabase.createClient(NEARBY_CONFIG.supabaseUrl,NEARBY_CONFIG.supabaseAnonKey);

const say=(h,t)=>{$("#main").innerHTML=`<div class="msg"><h2>${h}</h2><p>${t}</p></div>`};

function loginForm(){
  $("#main").innerHTML=`<form class="login" id="lf"><h2 style="margin:0">Admin log in</h2>
    <label>Email<input name="email" type="email" required autocomplete="email"></label>
    <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
    <p class="err" id="lerr" role="alert"></p><button class="btn" type="submit">Log in</button></form>`;
  $("#lf").addEventListener("submit",async e=>{
    e.preventDefault();const f=new FormData(e.target);
    const {error}=await sb.auth.signInWithPassword({email:String(f.get("email")).trim(),password:String(f.get("password"))});
    if(error)$("#lerr").textContent=error.message;
  });
}

async function start(){
  if(!sb)return say("Not set up","config.js is missing the Supabase URL and key.");
  const {data:{session}}=await sb.auth.getSession();
  if(!session){$("#out").hidden=true;$("#who").textContent="";return loginForm()}
  $("#who").textContent=session.user.email;$("#out").hidden=false;
  const {data:isAdmin,error}=await sb.rpc("is_admin");
  if(error)return say("Admin setup missing","Run step8_admin.sql in the Supabase SQL Editor. ("+esc(error.message)+")");
  if(!isAdmin)return say("Not an admin","This account is not an administrator.");
  try{localStorage.setItem("chadads-no-analytics","1")}catch(e){}   // the admin's own visits are not counted in the site statistics
  const rc=await sb.from("categories").select("*").order("id");
  if(rc.error)return say("Couldn't load",esc(rc.error.message));
  cats=rc.data.slice().sort((a,b)=>a.name.localeCompare(b.name));
  $("#ec").innerHTML=cats.map(c=>`<option value="${c.id}">${esc(c.name)}${c.active===false?" (hidden)":""}</option>`).join("");
  $("#main").innerHTML=`<div class="tabs"><button class="btn sm" id="tAds" type="button">Ads</button><button class="btn ghost sm" id="tRep" type="button">Reports <span class="pill" id="repN" hidden></span></button><button class="btn ghost sm" id="tDeal" type="button">Dealer feeds</button></div>
    <div id="adsView"><div class="filters">
      <input type="search" id="fq" placeholder="Search titles" aria-label="Search titles">
      <select id="fs" aria-label="Status"><option value="">All statuses</option><option value="active">Active</option><option value="sold">Sold</option><option value="hidden">Hidden (no pictures)</option></select>
      <select id="fd" aria-label="Source"><option value="">User and demo ads</option><option value="user">User ads only</option><option value="demo">Demo ads only</option></select>
      <select id="ff" aria-label="Featured"><option value="">All ads</option><option value="1">Featured ads only</option></select>
      <button class="btn ghost" id="fr">Refresh</button>
      <button class="btn ghost" id="fb" title="Makes the small copy of every photo that does not have one yet (needs step16_admin_photo_upload.sql)">Create small photo copies</button></div>
    <p class="sub" id="fbMsg" role="status"></p>
    <div id="list"></div></div>
    <div id="repView" hidden></div>
    <div id="dealView" hidden></div>`;
  let t;$("#fq").addEventListener("input",()=>{clearTimeout(t);t=setTimeout(()=>load(true),300)});
  $("#fs").addEventListener("change",()=>load(true));$("#fd").addEventListener("change",()=>load(true));
  $("#fr").addEventListener("click",()=>load(true));
  $("#fb").addEventListener("click",backfillThumbs);
  load(true);
  loadReports();
}

// ---- Dealer feeds (the importer is the Supabase Edge Function "import-feed"; see NOTES.md and step23_dealer_feed.sql) ----
function drawDealer(){
  if($("#dealOut"))return;
  $("#dealView").innerHTML=`<p class="sub" style="max-width:700px">Dealer ads are added, updated and hidden from the dealers' inventory file. Cars are matched by VIN (or stock number when there is no VIN), so a newer file updates the same ads, and a car missing from a dealer's part of the file is hidden as sold. <b>Preview</b> shows what would happen without changing anything.</p>
    <h3 style="margin:18px 0 6px;font-size:17px">Dealers</h3>
    <p class="sub" style="max-width:700px">Add each dealer once. The DealerID is the number in the feed's first column. Dealers never log in: a hidden placeholder account is created for them. Cars from a DealerID that is not listed here are ignored.</p>
    <div id="dealerList" class="sub">Loadingâ¦</div>
    <form id="addDealerForm" class="filters" style="align-items:flex-end" onsubmit="return false">
      <label>Feed name<input id="adFeed" value="carsforsale.com" style="width:150px"></label>
      <label>DealerID<input id="adCode" placeholder="1035978" style="width:110px"></label>
      <label>Dealer name<input id="adName" placeholder="Caruso Classics" maxlength="40" style="width:190px"></label>
      <label>Town<input id="adCity" placeholder="Cohasset" style="width:140px"></label>
      <label>State<input id="adState" placeholder="MA" maxlength="2" style="width:60px;text-transform:uppercase"></label>
      <label>Website<input id="adSite" placeholder="https://www.example.com/" style="width:230px"></label>
      <button class="btn" id="addDealerBtn" type="button">Add dealer</button>
    </form>
    <p class="sub" id="addDealerMsg" role="status"></p>
    <h3 style="margin:18px 0 6px;font-size:17px">Upload a feed file</h3>
    <p class="sub" style="max-width:700px">Download the inventory file (CSV) from carsforsale.com or the dealer, choose it here, press <b>Preview file</b>, and if it looks right press <b>Import file</b>. A big file imports in several rounds by itself.</p>
    <div class="filters"><input type="file" id="feedFile" accept=".csv,.txt,text/csv,text/plain" aria-label="Feed file"><label style="flex-direction:row;align-items:center;gap:8px">Feed name <input id="feedName" value="carsforsale.com" style="width:170px"></label>
      <button class="btn ghost" id="upPreview" type="button">Preview file (no changes)</button><button class="btn" id="upRun" type="button">Import file</button></div>
    <h3 style="margin:18px 0 6px;font-size:17px">Or read the feed link</h3>
    <p class="sub" style="max-width:700px">Only when a feed link has been set and switched on (see NOTES.md). The same link is read by the hourly schedule.</p>
    <div class="filters"><button class="btn ghost" id="dealPreview" type="button">Preview link (no changes)</button><button class="btn ghost" id="dealRun" type="button">Import from link now</button></div>
    <div id="dealOut" role="status"></div>`;
  loadDealers();
}
// ---- Dealers: list and add (importer modes ?dealers=1 and ?add_dealer=1; needs step28_add_dealer.sql) ----
async function importerCall(query,body){
  const {data:{session}}=await sb.auth.getSession();
  const res=await fetch(NEARBY_CONFIG.supabaseUrl+"/functions/v1/import-feed?"+query,{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:NEARBY_CONFIG.supabaseAnonKey,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
  const raw=await res.text();let j=null;try{j=JSON.parse(raw)}catch(e){}
  return {status:res.status,json:j,raw};
}
async function loadDealers(){
  const box=$("#dealerList");if(!box)return;
  try{
    const r=await importerCall("dealers=1&source="+encodeURIComponent(($("#adFeed").value||"").trim()));
    if(!r.json){box.textContent=r.status===404?"The importer is not installed yet.":"Could not read the dealer list.";return}
    if(r.json.error){box.textContent=r.json.error;return}
    const list=r.json.dealers||[];
    box.innerHTML=list.length?`<div class="wrapx"><table style="min-width:420px"><thead><tr><th>DealerID</th><th>Dealer</th><th>Town</th></tr></thead><tbody>${list.map(d=>`<tr><td>${esc(d.code)}</td><td>${esc(d.name)}</td><td>${esc(d.city_name)}, ${esc(d.state)}</td></tr>`).join("")}</tbody></table></div>`:"No dealers added yet.";
  }catch(e){box.textContent="Could not reach the importer."}
}
async function addDealer(){
  const msg=$("#addDealerMsg"),v=id=>($("#"+id).value||"").trim();
  msg.className="sub";msg.textContent="Addingâ¦";
  try{
    const r=await importerCall("add_dealer=1",{source:v("adFeed"),code:v("adCode"),name:v("adName"),city:v("adCity"),state:v("adState"),website:v("adSite")});
    if(!r.json){msg.className="err";msg.textContent=r.status===404?"The importer is not installed yet (or is an older version).":"Unexpected answer: "+r.raw.slice(0,200);return}
    if(r.json.error){msg.className="err";msg.textContent=r.json.error;return}
    msg.className="ok";msg.textContent=r.json.message||"Added.";
    ["adCode","adName","adCity","adState","adSite"].forEach(id=>{$("#"+id).value=""});
    loadDealers();
  }catch(e){msg.className="err";msg.textContent="Could not reach the importer ("+(e&&e.message||"error")+")."}
}
// Uploads the chosen file to the importer. A big file may need several rounds (the importer stops after about 100 seconds); we repeat until it is done.
async function runUpload(dry){
  const out=$("#dealOut"),f=$("#feedFile").files[0],name=($("#feedName").value||"").trim();
  if(!f)return out.innerHTML=`<p class="err">Choose a file first.</p>`;
  if(!name)return out.innerHTML=`<p class="err">Type the feed name (for example carsforsale.com).</p>`;
  let text;try{text=await f.text()}catch(e){return out.innerHTML=`<p class="err">Could not read that file.</p>`}
  if(text.length>25*1024*1024)return out.innerHTML=`<p class="err">That file is over 25 MB.</p>`;
  const {data:{session}}=await sb.auth.getSession();
  const url=NEARBY_CONFIG.supabaseUrl+"/functions/v1/import-feed?upload=1&source="+encodeURIComponent(name)+(dry?"&dry=1":"");
  const sums={};let last=null,round=0,left=0;
  for(round=1;round<=12;round++){
    out.innerHTML=`<p class="sub">${dry?"Reading the fileâ¦":"Importingâ¦ round "+round+". Large files take a few minutes; please keep this page open."}</p>`+(last?renderFeed(totals(last,sums),dry):"");
    let res,raw,j=null;
    try{res=await fetch(url,{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:NEARBY_CONFIG.supabaseAnonKey,"Content-Type":"text/csv"},body:text});raw=await res.text()}
    catch(e){return out.innerHTML=`<div class="msg"><h2>Could not reach the importer</h2><p>${esc(e&&e.message||"error")}</p></div>`}
    try{j=JSON.parse(raw)}catch(e){}
    if(res.status===404&&!j)return out.innerHTML=`<div class="msg"><h2>Importer not installed yet</h2><p>The "import-feed" function has not been deployed (or is an older version without uploads).</p></div>`;
    if(!j)return out.innerHTML=`<div class="msg"><h2>Unexpected answer</h2><p>${esc(raw.slice(0,300))}</p></div>`;
    if(j.error)return out.innerHTML=`<div class="msg"><h2>Not run</h2><p>${esc(j.error)}</p></div>`;
    for(const d of (j.results[0].dealers||[])){const s=sums[d.code]=sums[d.code]||{created:0,updated:0,sold:0,reactivated:0,photosCopied:0,unchangedBefore:0};
      s.created+=d.created||0;s.updated+=d.updated||0;s.sold+=d.sold||0;s.reactivated+=d.reactivated||0;s.photosCopied+=d.photosCopied||0}
    last=j;
    left=(j.results[0].dealers||[]).reduce((a,d)=>a+(d.deferred||0),0);
    if(dry||!left)break;
  }
  out.innerHTML=renderFeed(totals(last,sums),dry)+(left?`<p class="err">${left} cars are still waiting (the importer ran out of rounds or time). Press <b>Import file</b> again to continue; cars already done are skipped.</p>`:"");
}
// Adds up what every round did, so the result card shows the whole import and not only the last round.
function totals(j,sums){
  if(!sums||!Object.keys(sums).length)return j;
  const c=JSON.parse(JSON.stringify(j));
  for(const d of (c.results[0].dealers||[])){const s=sums[d.code];if(!s)continue;
    const doneEarlier=s.created+s.updated+s.reactivated-(d.created||0)-(d.updated||0)-(d.reactivated||0);
    d.unchanged=Math.max(0,(d.unchanged||0)-doneEarlier);d.created=s.created;d.updated=s.updated;d.sold=s.sold;d.reactivated=s.reactivated;d.photosCopied=s.photosCopied}
  return c;
}
// Turns the importer's answer into readable cards: one block per feed, one card per dealer.
function renderFeed(j,dry){
  const dealerCard=r=>r.error?`<div class="rep"><h3>${esc(r.dealer)}</h3><p class="err">${esc(r.error)}</p></div>`:
    `<div class="rep"><h3>${esc(r.dealer)} <span class="pill">DealerID ${esc(r.code)}</span> ${dry?'<span class="pill">preview, nothing changed</span>':""}</h3>
      <p>${r.rows} cars in the file. ${dry?"Would add":"Added"} <b>${r.created}</b>, ${dry?"would update":"updated"} <b>${r.updated}</b>, unchanged <b>${r.unchanged}</b>, ${dry?"would hide":"hid"} <b>${r.sold}</b> that left the file${r.reactivated?`, brought back <b>${r.reactivated}</b>`:""}${r.waiting?`, <b>${r.waiting}</b> waiting for pictures (not shown)`:""}${r.hidden?`, <b>${r.hidden}</b> hidden because they have no pictures`:""}${r.deferred?`, <b>${r.deferred}</b> left for the next run (out of time)`:""}${r.skipped?`, skipped <b>${r.skipped}</b>`:""}.${!dry&&r.photosCopied?` Copied ${r.photosCopied} photos.`:""}</p>
      ${(r.notes||[]).length?`<ul>${r.notes.slice(0,8).map(n=>`<li>${esc(n)}</li>`).join("")}</ul>`:""}
      ${(r.preview||[]).length?`<div class="wrapx"><table style="min-width:600px"><thead><tr><th>Action</th><th>Ad</th><th>Category</th><th>Price</th><th>Photos in file</th></tr></thead><tbody>${r.preview.map(p=>`<tr><td>${esc(p.action)}</td><td>${esc(p.title)}<div class="sub">VIN ${esc(p.vin)}</div></td><td>${esc(p.category)}</td><td>${esc(p.price)}</td><td>${p.photos}</td></tr>`).join("")}</tbody></table></div><p class="sub">First ${r.preview.length} cars shown.</p>`:""}</div>`;
  return j.results.map(s=>`<h2 style="margin:18px 0 8px;font-size:18px">${esc(s.source)} <span class="sub">${s.rows||0} cars in the file</span></h2>
    ${s.file?`<p class="sub">Drop-box file: <b>${esc(s.file.name)}</b>, received ${esc(new Date(s.file.modified).toLocaleString())}, ${Math.round(s.file.size/1024)} KB</p>`:""}
    ${(s.info||[]).map(n=>`<p class="sub">${esc(n)}</p>`).join("")}
    ${s.error?`<p class="err">${esc(s.error)}</p>`:""}
    ${(s.notes||[]).map(n=>`<p class="err">${esc(n)}</p>`).join("")}
    ${(s.unknown||[]).length?`<div class="rep"><h3>Dealers in the file that are not set up yet</h3><p class="sub">Their cars are ignored until you add them (see "Adding a dealer" in NOTES.md).</p><ul>${s.unknown.map(u=>`<li>DealerID <b>${esc(u.code)}</b>: ${u.cars} car${u.cars===1?"":"s"}</li>`).join("")}</ul></div>`:""}
    ${(s.dealers||[]).map(dealerCard).join("")||`<p class="sub">No dealers are set up for this feed.</p>`}`).join("");
}
async function runFeed(dry){
  const out=$("#dealOut");out.innerHTML=`<p class="sub">${dry?"Reading the feed…":"Importing… this can take a minute or two."}</p>`;
  try{
    const {data:{session}}=await sb.auth.getSession();
    const res=await fetch(NEARBY_CONFIG.supabaseUrl+"/functions/v1/import-feed"+(dry?"?dry=1":""),{method:"POST",headers:{Authorization:"Bearer "+session.access_token,apikey:NEARBY_CONFIG.supabaseAnonKey}});
    const text=await res.text();let j=null;try{j=JSON.parse(text)}catch(e){}
    if(res.status===404)return out.innerHTML=`<div class="msg"><h2>Importer not installed yet</h2><p>The "import-feed" function has not been deployed in Supabase.</p></div>`;
    if(!j)return out.innerHTML=`<div class="msg"><h2>Unexpected answer</h2><p>${esc(text.slice(0,300))}</p></div>`;
    if(j.error)return out.innerHTML=`<div class="msg"><h2>Not run</h2><p>${esc(j.error)}</p></div>`;
    if(j.message)return out.innerHTML=`<div class="msg"><h2>Nothing to do</h2><p>${esc(j.message)}</p></div>`;
    out.innerHTML=renderFeed(j,dry);
  }catch(e){out.innerHTML=`<div class="msg"><h2>Could not reach the importer</h2><p>${esc(e&&e.message||"error")}</p></div>`}
}

const REASONS={scam:"Scam or fraud",prohibited:"Prohibited or illegal item",spam:"Spam or duplicate",wrong:"Wrong category or location",misleading:"Misleading price or details",offensive:"Offensive content",sold:"Already sold",other:"Something else"};
let reps=[],repShow="open";
function showTab(w){

  $("#tAds").className="btn sm"+(w==="ads"?"":" ghost");$("#tRep").className="btn sm"+(w==="rep"?"":" ghost");$("#tDeal").className="btn sm"+(w==="deal"?"":" ghost");

async function loadReports(){

function drawReports(){
  const open=reps.filter(r=>r.status==="open"),n=new Set(open.map(r=>r.listing_id||("r"+r.id))).size;
  $("#repN").hidden=!n;$("#repN").textContent=n;
  const list=repShow==="all"?reps:reps.filter(r=>r.status===repShow);

  const groups=new Map();
  list.forEach(r=>{const k=r.listing_id||("r"+r.id);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(r)});
  const sel=`<div class="filters"><select id="repS" aria-label="Show"><option value="open"${repShow==="open"?" selected":""}>Open reports</option><option value="resolved"${repShow==="resolved"?" selected":""}>Handled</option><option value="dismissed"${repShow==="dismissed"?" selected":""}>Dismissed</option><option value="all"${repShow==="all"?" selected":""}>Everything</option></select><button class="btn ghost" id="repRefresh" type="button">Refresh</button></div>`;
  $("#repView").innerHTML=sel+(groups.size?[...groups.values()].map(g=>{
    const a=g[0],l=a.listings,title=a.listing_title||"(ad removed)",gone=!a.listing_id||!l;
    const isOpen=g.some(r=>r.status==="open");
    return `<div class="rep"><h3>${gone?esc(title):`<a href="/ad/${a.listing_id}" target="_blank" rel="noopener">${esc(title)}</a>`} <span class="pill">${g.length} report${g.length===1?"":"s"}</span>${l&&l.status!=="active"?` <span class="pill sold">${l.status==="hidden"?"hidden from the site":"sold"}</span>`:""}${gone?` <span class="pill demo">ad deleted</span>`:""}</h3>
      <div class="sub">${l&&l.profiles?"Seller: "+esc(l.profiles.display_name||"?"):""}</div>
      <ul>${g.map(r=>`<li><strong>${esc(REASONS[r.reason]||r.reason)}</strong>${r.details?`: ${esc(r.details)}`:""} <span class="sub">by ${esc(r.reporter&&r.reporter.display_name||"a member")} on ${esc(new Date(r.created_at).toLocaleDateString())}${r.status!=="open"?" ("+esc(r.status)+")":""}</span></li>`).join("")}</ul>
      <div class="acts" style="justify-content:flex-start">${gone?"":`<button class="btn ghost sm" data-rfind="${esc(title)}" type="button">Find in Ads (edit / delete)</button>${l.status==="hidden"?`<button class="btn sm" data-rlive="${a.listing_id}" data-rto="active" type="button">Put back live</button>`:l.status==="active"?`<button class="btn ghost sm" data-rlive="${a.listing_id}" data-rto="hidden" type="button">Hide ad now</button>`:""}`}${isOpen?`<button class="btn sm" data-rset="resolved" data-rl="${a.listing_id||""}" data-rid="${a.id}" type="button">Mark handled</button><button class="btn ghost sm" data-rset="dismissed" data-rl="${a.listing_id||""}" data-rid="${a.id}" type="button">Dismiss</button>`:""}</div></div>`}).join(""):`<div class="msg"><h2>No reports</h2><p>Nothing here right now.</p></div>`);

async function setListingStatus(id,to){   // "Put back live" / "Hide ad now" on a report card (admins may edit any ad)

async function load(reset){
  if(busy)return;busy=true;
  if(reset){from=0;rows=[]}
  let q=sb.from("listings").select("id,seller_id,title,description,price,price_on_request,featured,make,link,status,is_demo,created_at,category_id,city_id,video_link,categories(name),cities(name,state),profiles!seller_id(display_name),listing_photos(id,storage_path,position),listing_videos(id,storage_path)")
    .order("created_at",{ascending:false}).order("position",{referencedTable:"listing_photos"}).range(from,from+PAGE-1);
  const text=($("#fq").value||"").replace(/[%_*,()]/g," ").trim(),st=$("#fs").value,src=$("#fd").value;
  if(text)q=q.ilike("title","%"+text+"%");
  if(st)q=q.eq("status",st);
  if(src)q=q.eq("is_demo",src==="demo");

  rows=rows.concat(data);more=data.length===PAGE;from+=data.length;draw();

const photoUrl=p=>sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl;
// Every photo has a small copy next to it ("abc.jpg" -> "abc_t.jpg"). MUST match thumbPath() in public/index.html.
const thumbPath=p=>p.replace(/\.[A-Za-z0-9]+$/,"_t.jpg");
const withThumbs=ps=>ps.concat(ps.map(thumbPath));

      <td><div class="ttl" title="${esc(r.title)}">${r.featured?`<span class="pill" style="background:var(--acc);color:var(--acc-ink);margin-right:6px">★ Featured</span>`:""}${esc(r.title)}</div><div class="sub">#${r.id}${(r.listing_photos||[]).length>1?` · ${r.listing_photos.length} photos`:""}${(r.listing_videos||[]).length?" · video":""}${r.video_link?" · video link":""}</div></td>
      <td>${r.is_demo?`<span class="pill demo">Demo</span>`:esc(r.profiles?r.profiles.display_name:"(unknown)")}</td>
      <td>${esc(r.categories?r.categories.name:"")}</td>
      <td>${esc(r.cities?r.cities.name+", "+r.cities.state:"")}</td>
      <td>${r.price_on_request?"Call for price":r.price===0?"Free":"$"+r.price.toLocaleString()}</td>
      <td><span class="pill ${r.status==="sold"?"sold":""}">${esc(r.status)}</span></td>
      <td class="sub">${esc(when)}</td>
      <td><div class="acts"><button class="btn ghost sm" data-edit="${r.id}">Edit</button><button class="btn danger sm" data-del="${r.id}">Delete</button></div></td></tr>`}).join("")+
  `</tbody></table></div>${more?`<div class="more"><button class="btn ghost" id="more">Load more</button></div>`:""}`;

// There are 30,000+ places, so cities are searched in the database as you type (the search_cities function, step17_city_search.sql).
async function ensureCities(){}
let suggTimer=0,suggSeq=0;
function searchCities(text){
  clearTimeout(suggTimer);
  const s=text.trim();
  if(s.length<2)return;
  suggTimer=setTimeout(async()=>{
    const my=++suggSeq,{data}=await sb.rpc("search_cities",{q:s,lim:15});
    if(my!==suggSeq||!data)return;
    data.forEach(c=>{cityIds[c.name+", "+c.state]=c.id});
    $("#cl").innerHTML=data.map(c=>`<option value="${esc(c.name+", "+c.state)}">`).join("");
  },200);
}
async function lookupCityId(text){
  const want=text.trim().toLowerCase();
  const k=Object.keys(cityIds).find(n=>n.toLowerCase()===want);
  if(k)return cityIds[k];
  if(want.length<2)return null;
  const {data}=await sb.rpc("search_cities",{q:text.trim(),lim:15});
  const m=(data||[]).find(c=>(c.name+", "+c.state).toLowerCase()===want);
  if(m){cityIds[m.name+", "+m.state]=m.id;return m.id}
  return null;
}

$("#epor").addEventListener("change",e=>{e.target.form.elements.p.disabled=e.target.checked});
function safeUrl(u){try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:null}catch(e){return null}}

$("#fe").addEventListener("submit",async ev=>{
  ev.preventDefault();if(!editing)return;
  const e=ev.target.elements,err=$("#eErr");err.textContent="";
  const cityId=await lookupCityId(e.loc.value);
  if(!cityId){err.textContent="Choose a city from the list.";return}
  const catName=(cats.find(c=>String(c.id)===e.c.value)||{}).name;
  let link=e.link.value.trim()?safeUrl(e.link.value.trim()):null;
  if(e.link.value.trim()&&!link){err.textContent="The link must start with http:// or https://";return}
  if(!["Auto Cars","Auto Trucks","Auto SUVs"].includes(catName))link=null;   // the database only allows links on these categories
  const vl=e.vlink.value.trim();
  if(vl&&!VIDEO_LINK_OK.test(vl)){err.textContent="The video link must be a YouTube or Vimeo address starting with https://";return}
  const removed=[...ev.target.querySelectorAll('[name=rm]:checked')].map(x=>x.value);
  const go=$("#eGo");go.disabled=true;
  const {data,error}=await sb.from("listings").update({title:e.t.value.trim(),category_id:+e.c.value,city_id:cityId,
    price:e.por.checked?0:Math.max(0,Math.round(+e.p.value||0)),price_on_request:e.por.checked,featured:e.ft.checked,make:e.make.value.trim()||null,status:e.s.value,description:e.d.value.trim(),link,video_link:vl||null}).eq("id",editing.id).select("id");
  if(error||!data.length){go.disabled=false;err.textContent=error?error.message:"Not saved. Are you still an admin?";return}
  if(removed.length){
    const d=await sb.from("listing_photos").delete().eq("listing_id",editing.id).in("storage_path",removed);
    if(d.error){go.disabled=false;err.textContent="Saved, but photos were not removed: "+d.error.message;return}
    await sb.storage.from(BUCKET).remove(withThumbs(removed));
  }
  const vid=(editing.listing_videos||[])[0];
  if(vid&&e.rmv.checked){
    const dv=await sb.from("listing_videos").delete().eq("listing_id",editing.id);
    if(dv.error){go.disabled=false;err.textContent="Saved, but the video was not removed: "+dv.error.message;return}
    await sb.storage.from(VBUCKET).remove([vid.storage_path]);
  }
  go.disabled=false;$("#dEdit").close();
  const keep=from;from=0;rows=[];await loadKeep(keep);
});
// One-time (and any-time) tool: makes the small copy for every photo that lacks one. Safe to run again; it skips photos that already have one.
async function backfillThumbs(){
  const btn=$("#fb"),msg=$("#fbMsg");btn.disabled=true;msg.textContent="Looking at all photos…";
  let made=0,had=0,failed=0,lastErr="";
  try{
    const paths=[];
    for(let f=0;;f+=1000){
      const {data,error}=await sb.from("listing_photos").select("storage_path").order("id").range(f,f+999);
      if(error)throw error;paths.push(...data.map(r=>r.storage_path));if(data.length<1000)break;
    }
    let n=0;
    for(const p of paths){
      n++;msg.textContent=`Checking photo ${n} of ${paths.length}…`;
      const t=thumbPath(p);
      const head=await fetch(photoUrl(t),{method:"HEAD"}).catch(()=>null);
      if(head&&head.ok){had++;continue}
      try{
        const blob=await (await fetch(photoUrl(p))).blob();
        const bmp=await createImageBitmap(blob,{imageOrientation:"from-image"});
        const s=Math.min(1,600/Math.max(bmp.width,bmp.height)),c=document.createElement("canvas");
        c.width=Math.max(1,Math.round(bmp.width*s));c.height=Math.max(1,Math.round(bmp.height*s));
        const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,c.width,c.height);g.drawImage(bmp,0,0,c.width,c.height);bmp.close();
        const out=await new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
        const {error}=await sb.storage.from(BUCKET).upload(t,out,{contentType:"image/jpeg"});
        if(error)throw error;made++;
      }catch(e){failed++;lastErr=e&&e.message||String(e)}
    }
    msg.textContent=`Done. ${made} small cop${made===1?"y":"ies"} created, ${had} already existed${failed?`, ${failed} failed (${lastErr})`:""}.`+(failed&&/row-level|policy|permission/i.test(lastErr)?" Run step16_admin_photo_upload.sql in Supabase first.":"");
  }catch(e){msg.textContent="Couldn't finish: "+(e&&e.message||e)}
  btn.disabled=false;
}
// Reload the same number of rows that were showing, so the list doesn't jump back to the top.
async function loadKeep(n){
  const pages=Math.max(1,Math.ceil(n/PAGE));from=0;rows=[];
  for(let i=0;i<pages;i++){busy=false;await load(false);if(!more)break}
}

async function deleteAd(id){
  const r=rows.find(x=>x.id===id);if(!r)return;
  if(!confirm(`Delete "${r.title}"? This permanently removes the ad and its photos.`))return;
  const {data,error}=await sb.from("listings").delete().eq("id",id).select("id");
  if(error||!data.length){alert(error?error.message:"Not deleted. Are you still an admin?");return}
  const paths=(r.listing_photos||[]).map(p=>p.storage_path);
  if(paths.length)await sb.storage.from(BUCKET).remove(withThumbs(paths));
  const vpaths=(r.listing_videos||[]).map(p=>p.storage_path);
  if(vpaths.length)await sb.storage.from(VBUCKET).remove(vpaths);
  rows=rows.filter(x=>x.id!==id);draw();
}

document.addEventListener("click",e=>{
  const t=e.target;
  const ed=t.closest("[data-edit]");if(ed){openEdit(+ed.dataset.edit);return}
  const dl=t.closest("[data-del]");if(dl){deleteAd(+dl.dataset.del);return}
  if(t.id==="more"){load(false);return}
  if(t.id==="tAds"){showTab("ads");return}
  if(t.id==="tRep"||t.closest("#tRep")){showTab("rep");return}
  if(t.id==="tDeal"){showTab("deal");return}
  if(t.id==="dealPreview"){runFeed(true);return}
  if(t.id==="addDealerBtn"){addDealer();return}
  if(t.id==="upPreview"){runUpload(true);return}
  if(t.id==="upRun"){if(confirm("Import this file now? This adds, updates and hides the dealers' ads."))runUpload(false);return}
  if(t.id==="dealRun"){if(confirm("Run the import now? This adds, updates and hides the dealer's ads."))runFeed(false);return}
  const rf=t.closest("[data-rfind]");if(rf){showTab("ads");$("#fq").value=rf.dataset.rfind;load(true);return}
  const rs=t.closest("[data-rset]");if(rs){setReport(rs.dataset.rl,rs.dataset.rid,rs.dataset.rset);return}
  const rv=t.closest("[data-rlive]");if(rv){setListingStatus(rv.dataset.rlive,rv.dataset.rto);return}
  if(t.id==="eDel"&&editing){const id=editing.id;$("#dEdit").close();deleteAd(id);return}
  if(t.closest("[data-close]")){t.closest("dialog").close();return}
  if(t.tagName==="DIALOG")t.close();
});
