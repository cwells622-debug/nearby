<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>ChadAds cut-out cards (print this page)</title>
<style>
/* One US Letter sheet with 8 cards. Print, then cut along the dotted lines. Good for community boards, shop counters,
   or stuck on a vehicle's "for sale" sign. In the print window: Margins = None, Background graphics = on. */
@page{size:letter;margin:0}
*{box-sizing:border-box}
body{margin:0;background:#cfc8b8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.bar{max-width:8.5in;margin:14px auto;padding:12px 16px;background:#fff;border-radius:12px;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:15px;color:#333}
.bar button,.bar a{font:inherit;font-weight:600;background:#e95e0d;color:#1e1c19;border:0;border-radius:999px;padding:9px 20px;text-decoration:none;cursor:pointer}
.bar a.alt{background:#eee;color:#222}
.sheet{width:8.5in;height:11in;margin:0 auto 24px;background:#fff;padding:.6in .25in;display:grid;grid-template-columns:repeat(2,3.9in);grid-template-rows:repeat(4,2.3in);gap:.2in;justify-content:center;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card{position:relative;border:.02in dashed #999;background:#fbf7ef;color:#1e1c19;display:grid;grid-template-columns:1.6in 1fr;gap:.14in;align-items:center;padding:.12in .16in .22in;overflow:hidden}
.card::after{content:"";position:absolute;left:0;right:0;bottom:0;height:.1in;background:linear-gradient(90deg,#164663 0 33.3%,#e95e0d 33.3% 66.6%,#e9a70d 66.6%)}
.qr{background:#fff;padding:.05in;border:.03in solid #1e1c19;border-radius:.08in}
.qr img{display:block;width:100%;height:auto}
.logo{display:block;width:1.05in;height:auto;margin:0 0 .03in -.03in}
.t1{margin:0;font-size:.17in;font-weight:700;line-height:1.1}
.t2{margin:.03in 0 .04in;font-size:.27in;font-weight:900;line-height:1;color:#e95e0d;letter-spacing:-.01em}
.t3{margin:0;font-size:.14in;color:#5b5446;line-height:1.25}
.t3 b{color:#1e1c19}
@media print{body{background:none}.bar{display:none}.sheet{margin:0;box-shadow:none;page-break-after:always}}
</style>
</head>
<body>
<div class="bar"><span><b>8 cards per sheet</b> (US Letter). Print with <b>Margins: None</b> and <b>Background graphics: on</b>, then cut along the dotted lines.</span><span><button onclick="window.print()">Print</button> <a class="alt" href="flyer.html">Full-page flyer instead</a></span></div>
<div class="sheet" id="sheet"></div>
<script>
// Eight identical cards.
const card='<div class="card"><div class="qr"><img src="qr-sell.svg" alt="QR code for chadads.com/sell"></div>'+
 '<div><img class="logo" src="logo-sm.webp" alt="ChadAds"><p class="t1">Selling a truck, camper, ATV or equipment?</p><p class="t2">List it free</p>'+
 '<p class="t3">Scan, or visit <b>chadads.com/sell</b></p></div></div>';
document.getElementById("sheet").innerHTML=card.repeat(8);
</script>
</body>
</html>
