<html lang="en">
<head>

<style>
/* ChadAds look: black and white, one bright accent (--acc). Change --acc to restyle the whole site. */
:root{--bg:#fff;--panel:#fff;--ink:#1d1d1f;--mute:#6e6e73;--line:#e5e5ea;--acc:#0071e3;--acc-ink:#fff;--soft:#f5f5f7;--glass:rgba(255,255,255,.78);
--shadow:0 2px 4px rgba(0,0,0,.04),0 12px 28px rgba(0,0,0,.08);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--panel:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#38383a;--acc:#2997ff;--acc-ink:#fff;--soft:#2c2c2e;--glass:rgba(0,0,0,.72);--shadow:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{--bg:#000;--panel:#1c1c1e;--ink:#f5f5f7;--mute:#98989d;--line:#38383a;--acc:#2997ff;--acc-ink:#fff;--soft:#2c2c2e;--glass:rgba(0,0,0,.72);--shadow:0 2px 4px rgba(0,0,0,.4),0 12px 28px rgba(0,0,0,.5)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.47 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Inter,Roboto,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--glass);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center;padding:12px 20px}
.logo{display:flex;align-items:center;color:var(--ink);text-decoration:none;white-space:nowrap}
.logo img{height:62px;width:auto;display:block}
.search{flex:1 1 0;min-width:0;border:0;background:var(--soft);border-radius:999px;padding:11px 18px}
.search::placeholder{color:var(--mute)}
.btn{border:0;background:var(--acc);color:var(--acc-ink);font-weight:600;border-radius:999px;padding:10px 20px;white-space:nowrap;transition:opacity .15s}
.btn:hover{opacity:.88}
.btn.ghost{background:var(--soft);color:var(--ink)}
.wrap{max-width:1200px;margin:0 auto;padding:16px 20px 56px}
aside{display:flex;gap:8px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
aside::-webkit-scrollbar{display:none}
aside h3{display:none}
.cat{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;border:0;background:var(--soft);border-radius:999px;padding:8px 14px;font-weight:500;font-size:14px;transition:background .15s}
.cat:hover{background:var(--line)}
.cat[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.cat .ic{font-size:15px;line-height:1}
.cat .n{display:none}
/* Computer screens: categories go down the left side, phones keep the scrolling pills above */
@media (min-width:761px){
 .wrap{display:grid;grid-template-columns:220px minmax(0,1fr);gap:36px;align-items:start}
 aside{position:sticky;top:84px;flex-direction:column;gap:2px;overflow-x:hidden;overflow-y:auto;max-height:calc(100vh - 100px);padding:0 6px 0 0}
 .cat{width:100%;background:none;border-radius:12px;padding:9px 12px;font-size:15px;gap:10px}
 .cat:hover{background:var(--soft)}
 .cat[aria-pressed="true"]{background:var(--soft);color:var(--ink);font-weight:600}
 .cat .ic{width:26px;text-align:center;font-size:18px}
 .cat .n{display:inline;margin-left:auto;color:var(--mute);font-size:13px;font-weight:400}
}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0 18px;flex-wrap:wrap}
h1,h2{margin:0;letter-spacing:-.02em}
h1{font-size:30px;font-weight:700}
h2{font-size:21px;font-weight:600}
select{border:0;background:var(--soft);border-radius:12px;padding:9px 12px}
.sec{margin-bottom:36px}
.sec .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}
.link{border:0;background:none;color:var(--acc);font-weight:500;padding:4px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(220px,100%),1fr));gap:28px 20px}
.card{border:0;background:none;border-radius:0;padding:0;text-align:left;overflow:visible;display:block;width:100%}
.card .ph{transition:transform .25s ease,box-shadow .25s ease}
.card:hover .ph{transform:translateY(-3px);box-shadow:var(--shadow)}
.ph{aspect-ratio:4/3;background:var(--soft);border-radius:16px;display:grid;place-items:center;font-size:56px;overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.cb{padding:12px 2px 0;display:flex;flex-direction:column;gap:2px}
.cb b{font-size:17px;font-weight:600}
.cb .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb .m{color:var(--mute);font-size:14px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 8px}
.locpill{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-weight:500;transition:border-color .15s}
.locpill:hover{border-color:var(--mute)}
.locpanel{background:var(--soft);border-radius:20px;padding:18px;margin:8px 0 20px}
.tog{display:inline-flex;background:var(--soft);border-radius:999px;padding:3px}
.tog button{border:0;background:none;padding:7px 16px;font-weight:500;border-radius:999px;color:var(--mute);transition:all .15s}
.tog button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:12px 0 0;color:var(--mute);font-size:14px}
.chips button{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:5px 12px;font-weight:500}
.note{color:var(--mute);margin:0 0 12px}
.near{align-items:end;display:flex;gap:12px;flex-wrap:wrap}.near label{flex:1;min-width:150px}
.empty{background:var(--soft);border-radius:22px;padding:48px 20px;text-align:center;color:var(--mute)}
.empty h2{color:var(--ink);margin-bottom:6px}
dialog{border:0;border-radius:26px;padding:0;width:min(580px,94vw);max-height:92vh;background:var(--panel);color:var(--ink);box-shadow:0 30px 80px rgba(0,0,0,.35)}
dialog[open]{animation:pop .22s ease}
@keyframes pop{from{opacity:0;transform:scale(.97) translateY(6px)}to{opacity:1;transform:none}}
dialog::backdrop{background:rgba(0,0,0,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.dlg{padding:24px;display:flex;flex-direction:column;gap:14px}
.dlg .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:0;background:var(--soft);width:34px;height:34px;border-radius:50%;color:var(--mute)}
label{display:flex;flex-direction:column;gap:6px;font-weight:500;font-size:14px;color:var(--mute)}
label input,label select,label textarea{border:1px solid transparent;background:var(--soft);border-radius:12px;padding:12px;font-weight:400;color:var(--ink)}
label input:focus,label select:focus,label textarea:focus{outline:none;border-color:var(--acc);background:var(--panel)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{aspect-ratio:4/3;border-radius:20px;font-size:80px}
.price{font-size:30px;font-weight:700;letter-spacing:-.02em}
.tag{display:inline-block;background:var(--soft);border-radius:999px;padding:3px 12px;font-size:13px;font-weight:500;width:fit-content}
.sbtn{border:0;background:var(--soft);border-radius:16px;padding:12px;text-align:left;width:100%}.sbtn:hover{background:var(--line)}.sbtn b{color:var(--ink)}
.qa{display:flex;gap:8px;flex-wrap:wrap}.qa button{border:0;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:500}.qa button:hover{background:var(--line)}.offer{display:flex;flex-direction:column;gap:10px;background:var(--soft);border-radius:16px;padding:14px}
.cw{position:relative;min-width:0}.heart{position:absolute;top:10px;right:10px;width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.88);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#1d1d1f;font-size:18px;display:grid;place-items:center;transition:transform .15s}
.heart:hover{transform:scale(1.08)}
.heart[aria-pressed="true"],.btn[aria-pressed="true"]{color:var(--acc)}
.seller{display:flex;gap:10px;align-items:center;color:var(--mute)}
.av{width:36px;height:36px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-weight:700}
.ok{background:var(--soft);padding:12px 14px;border-radius:14px;font-weight:500}
/* Ad pop-up: big gallery on the left, details on the right (stacked on phones) */
dialog.wide{width:min(1020px,96vw)}
.dlg.ad{padding:0;gap:0}
.adg{display:grid;grid-template-columns:minmax(0,1fr)}
.gwrap{min-width:0}
.gal{position:relative;aspect-ratio:4/3;background:var(--soft);overflow:hidden;touch-action:pan-y;outline-offset:-3px}
.gal .gimg{width:100%;height:100%;display:grid;place-items:center;font-size:96px;background:var(--soft)}
.gal .gimg img{width:100%;height:100%;object-fit:cover;display:block}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:42px;height:42px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#1d1d1f;font-size:26px;line-height:1;display:grid;place-items:center;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.2);transition:transform .15s}
.gnav:hover{transform:translateY(-50%) scale(1.07)}
.gnav.prev{left:12px}.gnav.next{right:12px}
.gcount{position:absolute;bottom:12px;right:12px;background:rgba(0,0,0,.55);color:#fff;font-size:13px;font-weight:500;padding:3px 10px;border-radius:999px}
.gx{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.9);color:#1d1d1f;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);box-shadow:0 2px 10px rgba(0,0,0,.2);z-index:2}
.gthumbs{display:flex;gap:8px;padding:12px 16px 4px;overflow-x:auto}
.gthumbs button{flex:none;padding:0;border:0;background:none;border-radius:12px;opacity:.6;transition:opacity .15s}
.gthumbs button[aria-pressed="true"]{opacity:1}
.gthumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;display:block;border:2px solid transparent}
.gthumbs button[aria-pressed="true"] img{border-color:var(--ink)}
.adi{padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px;min-width:0}
.prow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.adt{font-size:22px;line-height:1.25}
.adi .d{margin:0;white-space:pre-line;overflow-wrap:anywhere}
.ctas{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.btn.lg{width:100%;padding:14px 20px;font-size:17px}
.savebtn{border:0;background:var(--soft);border-radius:999px;padding:8px 16px;font-weight:600;white-space:nowrap}
.savebtn[aria-pressed="true"]{color:var(--acc)}
@media (min-width:860px){
 .adg{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);max-height:92vh}
 .adi{overflow-y:auto;max-height:92vh;padding:30px 28px}
 .gal{aspect-ratio:auto;height:calc(92vh - 92px);min-height:380px}
}
/* Video: player inside the gallery, thumbnail tile, "play" badge on cards, rows in the Post form */
.gal video,.gal iframe{width:100%;height:100%;border:0;background:#000;display:block}
.gthumbs .vt{width:64px;height:64px;border-radius:12px;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:20px;border:2px solid transparent}
.gthumbs button[aria-pressed="true"] .vt{border-color:var(--acc)}
.vbadge{position:absolute;left:10px;bottom:10px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;pointer-events:none}
.vrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px}
.vrow span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .ph{position:relative}
.share{display:flex;flex-direction:column;gap:8px;margin-top:6px;padding-top:14px;border-top:1px solid var(--line)}
.share .sh{font-size:13px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.05em}
.sharerow{display:flex;gap:8px;flex-wrap:wrap}
.spill{border:0;background:var(--soft);color:var(--ink);border-radius:999px;padding:8px 15px;font-weight:500;font-size:14px;text-decoration:none;display:inline-block;transition:background .15s}
.spill:hover{background:var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:64px;height:64px;object-fit:cover;border-radius:12px;border:2px solid transparent;display:block}
.thumbs button{padding:0;border:0;background:none;border-radius:12px}
.thumbs button[aria-pressed="true"] img{border-color:var(--acc)}
.thumbs .rm{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;font-weight:400}
.thumbs .rm input{margin:0}
.who{color:var(--mute);font-size:14px;white-space:nowrap;max-width:150px;overflow:hidden;text-overflow:ellipsis}
.hdr-r{display:flex;gap:8px;align-items:center}
.autherr{color:#d70015;margin:0;font-size:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .autherr{color:#ff6961}}
:root[data-theme="dark"] .autherr{color:#ff6961}
@media (max-width:760px){
 .who{display:none}
 header{padding:10px 14px;gap:10px;flex-wrap:wrap}
 .logo{flex:1}
 .search{order:3;flex:1 1 100%}
 .wrap{padding:12px 14px 48px}
 .logo img{height:46px}
 .btn{padding:8px 13px;font-size:15px}
 h1{font-size:25px}
 .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px}
 .dlg{padding:20px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="./" aria-label="ChadAds home"><img src="logo.webp" alt="ChadAds" width="96" height="64"></a>
  <input class="search" id="q" type="search" placeholder="Search listings" aria-label="Search listings">
  <div class="hdr-r">
    <span class="who" id="who"></span>
    <button class="btn ghost" id="auth">Log in</button>
    <button class="btn" id="post">Post an ad</button>
  </div>
</header>
<div class="wrap">
  <aside id="cats" aria-label="Categories"></aside>
  <main id="main"><p class="note">Loading listings…</p></main>
</div>

<dialog id="dPost"><form class="dlg" id="f">
  <div class="top"><h2 id="postTitle">Post an ad</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
  <label>Title<input name="t" required maxlength="60" placeholder="What are you selling?"></label>
  <div class="row">
    <label>Category<select name="c" id="fc"></select></label>
    <label>Price ($, 0 for free)<input name="p" type="number" min="0" value="0" required></label>
  </div>
  <label>City<input name="loc" id="fl" list="cl" required autocomplete="off" placeholder="Start typing a city"></label><datalist id="cl"></datalist>
  <label>Description<textarea name="d" rows="3" required placeholder="Condition, size, pickup details"></textarea></label>
  <label id="linkRow" hidden>Link (optional)<input name="link" type="url" maxlength="500" placeholder="https://" autocomplete="off"></label>
  <div id="curPhotos" class="thumbs" hidden></div>
  <label><span id="photoLbl">Photos (optional, up to 5; JPG, PNG or WebP, 5 MB each)</span><input id="fimg" type="file" multiple accept="image/jpeg,image/png,image/webp"></label>
  <div id="newPhotos" class="thumbs" hidden></div>
  <div id="curVideo" class="vrow" hidden></div>
  <label><span id="videoLbl">Video clip (optional, MP4, MOV or WebM, up to 50 MB)</span><input id="fvid" type="file" accept="video/mp4,video/quicktime,video/webm"></label>
  <div id="newVideo" class="vrow" hidden></div>
  <label>Or a video link (YouTube or Vimeo, optional)<input name="vlink" type="url" maxlength="200" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off"></label>
  <p class="autherr" id="postMsg" role="alert"></p>
  <button class="btn" type="submit" id="postGo">Publish ad</button>
</form></dialog>

<dialog id="dView"><div class="dlg" id="view"></div></dialog>

<dialog id="dAuth"><form class="dlg" id="fa">
  <div class="top"><h2 id="authTitle">Log in</h2><button type="button" class="x" data-close aria-label="Close">✕</button></div>
  <label id="nameRow" hidden>Display name<input name="name" maxlength="40" autocomplete="nickname" placeholder="How sellers will see you"></label>
  <label>Email<input name="email" type="email" required autocomplete="email"></label>
  <label>Password<input name="password" type="password" required minlength="8" autocomplete="current-password" placeholder="At least 8 characters"></label>
  <p class="autherr" id="authMsg" role="alert"></p>
  <button class="btn" type="submit" id="authGo">Log in</button>
  <button class="link" type="button" id="authSwitch">New here? Create an account</button>
</form></dialog>

<!-- Supabase's JavaScript library (pinned to version 2) and our public settings -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script>
// Filled in from Supabase by loadData() at the bottom of the page.
// cats: [name, icon, hue]   items: the listings   T: "City, ST" -> [lat, lng]
const HUES={Vehicles:210,Property:150,Electronics:190,Furniture:30,Clothing:330,Sports:100,Jobs:260,ATV:20,Appliances:170,Campers:120,"Real Estate":140,Medical:350,Motorcycles:0,Antiques:40,"Lawn and Garden":90,"Heavy Machinery":50};
let cats=[],items=[];
const T={};
let cur="All",q="",sort="new",me="Saratoga Springs, NY",rad=50,view="all",showLoc=false,geoMsg="",ow=false;
const offers={};
const SL={"Saratoga Springs, NY":["Dana R.",2021,4.9,41,"within an hour"],"Ballston Spa, NY":["Hannah K.",2022,4.7,12,"within a few hours"],"Clifton Park, NY":["Priya S.",2020,4.8,63,"within an hour"],"Schenectady, NY":["Tom W.",2023,4.5,6,"within a day"],"Albany, NY":["Marcus T.",2019,4.9,88,"within an hour"],"Troy, NY":["Leo B.",2021,4.6,27,"within a few hours"],"Glens Falls, NY":["Gail P.",2022,4.8,15,"within a day"],"Queensbury, NY":["Rick M.",2018,4.7,34,"within a few hours"],"Boston, MA":["Alex C.",2020,4.8,52,"within an hour"],"Burlington, VT":["Sam H.",2022,4.9,19,"within a few hours"],"Hartford, CT":["Jo L.",2021,4.4,9,"within a day"],"New York, NY":["Chris D.",2019,4.7,71,"within an hour"],"Pittsburgh, PA":["Nina V.",2023,5,4,"within a few hours"],"Syracuse, NY":["Omar F.",2022,4.6,11,"within a day"]};
// Is this ad mine? (i.you = posted this session; sid = seller's account id from the database)
const isMine=i=>!!(i.you||(user&&i.sid&&i.sid===user.id));
const sel=i=>{if(isMine(i))return{n:"You",y:"today",r:0,rv:0,rt:""};if(i.sn)return{n:i.sn,y:i.sy,r:0,rv:0,rt:""};const a=SL[i.loc]||["Local seller",2023,0,0,"within a day"];return{n:a[0],y:a[1],r:a[2],rv:a[3],rt:a[4]}};
const rate=s=>s.r?`★ ${s.r} (${s.rv} reviews)`:"No reviews yet";
function prof(id){
  $("#view").className="dlg";$("#dView").classList.remove("wide");
  const i=items.find(x=>x.id==id),s=sel(i),l=items.filter(x=>isMine(i)?isMine(x):i.sid?x.sid===i.sid:(!x.sid&&!isMine(x)&&x.loc===i.loc));
  $("#view").innerHTML=`<div class="top"><button class="link" data-back="${i.id}">← Back to listing</button><button class="x" data-close aria-label="Close">✕</button></div>
  <div class="seller"><div class="av" style="width:56px;height:56px;font-size:22px">${esc(s.n[0])}</div><div><h2 style="color:var(--ink)">${esc(s.n)}</h2><span>${esc(i.loc)} · Member since ${s.y}</span></div></div>
  <div>${rate(s)}${s.rt?` · Replies ${s.rt}`:""}</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">${isMine(i)||i.sn?`<span class="tag">New seller</span>`:`<span class="tag">Email verified</span><span class="tag">Phone verified</span>`}</div>
  <h2>Listings (${l.length})</h2><div class="grid">${l.map(card).join("")}</div>`;
}
const offerHtml=(i,s)=>isMine(i)||i.p<2?"":offers[i.id]?`<div class="ok">You offered ${fmt(offers[i.id])}. ${esc(s.n)} will reply by email.</div>`:`<button class="btn ghost" data-offer="${i.id}">Make an offer</button>`;
function offerForm(id){
  const i=items.find(x=>x.id==id),amts=[...new Set([.9,.8,.7].map(f=>Math.max(1,Math.round(i.p*f))))].filter(a=>a<i.p);
  $("#offer").innerHTML=`<div class="offer"><b>Your offer</b><span style="color:var(--mute)">Asking price: ${fmt(i.p)}</span><div class="qa">${amts.map(a=>`<button type="button" data-amt="${a}">${fmt(a)}</button>`).join("")}</div><label>Offer amount ($)<input id="oa" type="number" min="1" value="${amts[0]||1}"></label><p id="oerr" class="note" role="alert" style="margin:0"></p><button class="btn" data-sendoffer="${i.id}">Send offer</button></div>`;
}
function sendOffer(id){
  const i=items.find(x=>x.id==id),s=sel(i),n=Math.round(+$("#oa").value),err=m=>{$("#oerr").textContent=m};
  if(!(n>=1))return err("Enter an offer of $1 or more.");
  if(n>=i.p)return err("That's the asking price or higher. Send a message to buy at the asking price.");
  if(n<i.p*.5&&!ow){ow=true;return err("Offers under half the asking price are rarely accepted. Press Send offer again to send it anyway.")}
  offers[i.id]=n;ow=false;
  $("#offer").innerHTML=`<div class="ok">Offer of ${fmt(n)} sent to ${esc(s.n)}. They'll reply by email${s.rt?", usually "+s.rt:""}.</div>`;
}
const pa=i=>i.ago==="Just now"?"Posted just now":"Posted "+i.ago+" ago";
const dc=(a,b)=>{const r=x=>x*Math.PI/180,dl=r(b[0]-a[0]),dn=r(b[1]-a[1]),h=Math.sin(dl/2)**2+Math.cos(r(a[0]))*Math.cos(r(b[0]))*Math.sin(dn/2)**2;return 3959*2*Math.asin(Math.sqrt(h))};
const dist=i=>dc(T[me],T[i.loc]);
function locate(){
  if(!navigator.geolocation){geoMsg="Location isn't available here. Type your city instead.";render();return}
  navigator.geolocation.getCurrentPosition(p=>{const c=[p.coords.latitude,p.coords.longitude];me=Object.keys(T).sort((a,b)=>dc(c,T[a])-dc(c,T[b]))[0];geoMsg="Set to the closest city we have: "+me+".";render()},()=>{geoMsg="Couldn't get your location. Type your city instead.";render()},{timeout:8000});
}
const dd=i=>{const d=dist(i);return d<1?"Under 1 mi":Math.round(d)+" mi away"};
const inR=i=>!rad||dist(i)<=rad;
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=p=>p===0?"Free":"$"+p.toLocaleString();
const saved=new Set();
const card=i=>`<div class="cw"><button class="card" data-id="${i.id}"><div class="ph" style="--h:${i.h}">${i.img?`<img src="${esc(i.img)}" alt="">`:`<span>${i.e}</span>`}${i.hasVideo?`<span class="vbadge">▶ Video</span>`:""}</div><div class="cb"><b>${fmt(i.p)}</b><span class="t">${esc(i.t)}</span><span class="m">${esc(i.loc)} · ${dd(i)}</span></div></button><button class="heart" data-save="${i.id}" aria-pressed="${saved.has(i.id)}" aria-label="Save listing">${saved.has(i.id)?"♥":"♡"}</button></div>`;
// Saved ads live in the database (favorites table), private to the signed-in user.
// The page keeps a copy in "saved" so hearts can be drawn instantly.
function paintHearts(id,on){
  document.querySelectorAll(`[data-save="${id}"]`).forEach(b=>{b.setAttribute("aria-pressed",on);b.textContent=b.classList.contains("heart")?(on?"♥":"♡"):(on?"♥ Saved":"♡ Save")});
  side();if(cur==="Saved")render();
}
async function toggleSave(id){
  id=+id;
  if(!user){needLogin("Please log in or create an account to save ads.");return}
  const on=!saved.has(id);on?saved.add(id):saved.delete(id);paintHearts(id,on);
  const {error}=on?await sb.from("favorites").insert({user_id:user.id,listing_id:id})
                  :await sb.from("favorites").delete().eq("user_id",user.id).eq("listing_id",id);
  if(error){on?saved.delete(id):saved.add(id);paintHearts(id,!on);alert("Couldn't update your saved ads: "+error.message)}
}

function side(){
  const row=(n,e,k)=>`<button class="cat" data-cat="${n}" aria-pressed="${cur===n}">${n}<span class="n">${k}</span></button>`;

  box.scrollLeft=sl;box.scrollTop=st;   // keep the list where the visitor scrolled it
}
function render(){
  side();
  const match=i=>(cur==="Saved"?saved.has(i.id):(cur==="All"||i.c===cur)&&inR(i))&&(!q||(i.t+" "+i.d+" "+i.loc).toLowerCase().includes(q));
  let list=items.filter(match);
  const main=$("#main");
  const gm=geoMsg;geoMsg="";
  const near=Object.keys(T).filter(k=>k!==me).sort((a,b)=>dc(T[me],T[a])-dc(T[me],T[b])).slice(0,4);
  if(gm)showLoc=true;
  const bar=`<div class="locpanel"><div class="near"><label>City<input id="me" list="cl" value="${esc(me)}" placeholder="Start typing a city" autocomplete="off"></label><label>Within<select id="rad">${[[0,"Any distance"],[5,"5 miles"],[10,"10 miles"],[25,"25 miles"],[50,"50 miles"],[100,"100 miles"]].map(r=>`<option value="${r[0]}"${r[0]===rad?" selected":""}>${r[1]}</option>`).join("")}</select></label><button class="btn ghost" id="geo" type="button">Use my location</button></div><div class="chips">Nearby: ${near.map(n=>`<button data-city="${esc(n)}">${esc(n)}</button>`).join("")}</div>${gm?`<p class="note" style="margin:12px 0 0">${esc(gm)}</p>`:""}</div>`;
  const pill=`<button class="locpill" id="locToggle" type="button" aria-expanded="${showLoc}">📍 ${esc(me)} · ${rad?rad+" mi":"Any distance"}</button>`;
  const tog=cur==="All"&&!q?`<div class="tog"><button data-view="cat" aria-pressed="${view==="cat"}">By category</button><button data-view="all" aria-pressed="${view==="all"}">View all</button></div>`:"";
  // One slim row (location + view switch); the full location controls open underneath on demand.
  const nb=cur==="Saved"?"":`<div class="toolbar">${pill}${tog}</div>`+(showLoc?bar:"");
  if(!list.length){main.innerHTML=nb+`<div class="empty">${cur==="Saved"?user?`<h2>Nothing saved yet</h2><p>Tap the heart on any ad to save it here.</p>`:`<h2>Log in to see your saved ads</h2><p>Saved ads are kept in your account, so you can see them on any device.</p>`:`<h2>No listings found</h2><p>Try a wider distance, a different search, or post an ad.</p>`}</div>`;return}
  if(cur==="All"&&!q&&view==="cat"){
    main.innerHTML=nb+cats.map(c=>{const l=items.filter(i=>i.c===c[0]&&inR(i)).sort((a,b)=>dist(a)-dist(b));if(!l.length)return"";
      return `<section class="sec"><div class="hd"><h2>${c[0]}</h2><button class="link" data-cat="${c[0]}">See all ${l.length}</button></div><div class="grid">${l.slice(0,4).map(card).join("")}</div></section>`}).join("");
    return;
  }
  if(sort==="low")list.sort((a,b)=>a.p-b.p);else if(sort==="high")list.sort((a,b)=>b.p-a.p);else if(sort==="near")list.sort((a,b)=>dist(a)-dist(b));else if(sort==="old")list.sort((a,b)=>b.hrs-a.hrs||a.id-b.id);else list.sort((a,b)=>a.hrs-b.hrs||b.id-a.id);
  main.innerHTML=nb+`<div class="bar"><h1>${q?`Results for “${esc(q)}”`:cur==="All"?"All listings":cur==="Saved"?"Saved listings":esc(cur)}</h1><select id="sort" aria-label="Sort"><option value="new">Newest first</option><option value="old">Oldest first</option><option value="near">Nearest</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div><div class="grid">${list.map(card).join("")}</div>`;
  $("#sort").value=sort;
}
// ---- Sharing: every ad has its own link, like  https://chadads.netlify.app/?ad=26 ----
const adUrl=id=>location.origin+location.pathname+"?ad="+id;
function shareHtml(i){
  const url=adUrl(i.id),txt=i.t+" – "+fmt(i.p)+" on ChadAds",u=encodeURIComponent(url),t=encodeURIComponent(txt);
  const link=(href,label,tab)=>`<a class="spill" href="${esc(href)}"${tab?` target="_blank" rel="noopener noreferrer"`:""}>${label}</a>`;

    ${navigator.share?`<button class="spill" type="button" data-nshare="${i.id}">Share…</button>`:""}

    ${link("mailto:?subject="+t+"&body="+encodeURIComponent(txt+"\n"+url),"Email",0)}
    <button class="spill" type="button" data-copy="${i.id}">Copy link</button></div></div>`;
}
// ---- Ad pop-up: photo gallery ----
let gi=0,gId=null;
// One "slide" of the gallery: a photo, an uploaded video, or a YouTube/Vimeo player.
function slideHtml(m,k,n){
  if(m.t==="vid")return `<video src="${esc(m.u)}" controls playsinline preload="metadata"></video>`;
  if(m.t==="emb")return `<iframe src="${esc(m.u)}" title="Video" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture; fullscreen" sandbox="allow-scripts allow-same-origin allow-presentation allow-popups"></iframe>`;
  return `<img src="${esc(m.u)}" alt="Photo ${k+1} of ${n}">`;
}
function showPhoto(n){
  const i=items.find(x=>x.id===gId);if(!i||!i.media||!i.media.length)return;
  gi=(n+i.media.length)%i.media.length;
  $("#gal .gimg").innerHTML=slideHtml(i.media[gi],gi,i.media.length);   // replacing the slide also stops any playing video
  const ct=$("#gal .gcount");if(ct)ct.textContent=(gi+1)+" / "+i.media.length;
  document.querySelectorAll(".gthumbs button").forEach((b,k)=>b.setAttribute("aria-pressed",k===gi));
}
function open(id){
  const i=items.find(x=>x.id==id),s=sel(i),n=(i.media||[]).length,mine=isMine(i);
  gId=i.id;gi=0;
  $("#view").className="dlg ad";$("#dView").classList.add("wide");
  $("#view").innerHTML=`<div class="adg"><div class="gwrap">
    <div class="gal" id="gal" tabindex="0" aria-label="Photos of ${esc(i.t)}">
      <div class="gimg">${n?slideHtml(i.media[0],0,n):`<span>${i.e}</span>`}</div>
      ${n>1?`<button class="gnav prev" data-gnav="-1" aria-label="Previous">‹</button><button class="gnav next" data-gnav="1" aria-label="Next">›</button><span class="gcount">1 / ${n}</span>`:""}
      <button class="x gx" data-close aria-label="Close">✕</button>
    </div>

  </div>
  <div class="adi">
    <span class="tag">${esc(i.c)}</span>
    <div class="prow"><div class="price">${fmt(i.p)}</div><button class="savebtn" data-save="${i.id}" aria-pressed="${saved.has(i.id)}">${saved.has(i.id)?"♥ Saved":"♡ Save"}</button></div>
    <h2 class="adt">${esc(i.t)}</h2>
    <div class="m" style="color:var(--mute)">${esc(i.loc)} · ${dd(i)} · Posted ${i.ago==="Just now"?"just now":i.ago+" ago"}</div>
    <p class="d">${esc(i.d)}</p>
    ${safeUrl(i.link)?`<p style="margin:0"><a href="${esc(safeUrl(i.link))}" data-ext target="_blank" rel="noopener noreferrer nofollow ugc" style="color:var(--acc);font-weight:600">🔗 ${esc(new URL(i.link).hostname)}</a></p>`:""}
    <button class="seller sbtn" data-prof="${i.id}"><div class="av">${esc(s.n[0])}</div><span><b>${esc(s.n)}</b><br>${rate(s)} · View profile</span></button>
    ${mine?(i.sid?`<div class="ctas"><button class="btn lg" data-edit="${i.id}">Edit this ad</button><button class="btn ghost lg" data-del="${i.id}">Delete this ad</button></div>`:""):
      `<div class="ctas"><button class="btn lg" id="msgBtn">Message ${esc(s.n)}</button><div id="offer">${offerHtml(i,s)}</div></div>
       <div id="msg" hidden><label>Your message<textarea id="mt" rows="3">Hi, is this still available?</textarea></label><button class="btn lg" style="margin-top:10px" id="send">Send message</button></div>`}
    ${shareHtml(i)}
  </div></div>`;
  try{history.replaceState(null,"","?ad="+i.id)}catch(e){}   // so the address bar can be copied too
  {const d=$("#dView");if(!d.open)d.showModal()}
}
// When the pop-up closes, take "?ad=..." back out of the address.
$("#dView").addEventListener("close",()=>{
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  $("#view").innerHTML="";   // empties the pop-up, which also stops any video still playing
});
// Arrow keys flip photos; swiping left or right on the photo does too.
document.addEventListener("keydown",e=>{
  if(!$("#dView").open||!$("#gal")||/^(INPUT|TEXTAREA|SELECT|VIDEO|IFRAME)$/.test(e.target.tagName))return;
  if(e.key==="ArrowRight"){showPhoto(gi+1);e.preventDefault()}else if(e.key==="ArrowLeft"){showPhoto(gi-1);e.preventDefault()}
});
let sx=null;
document.addEventListener("touchstart",e=>{sx=e.target.closest("#gal")?e.touches[0].clientX:null},{passive:true});
document.addEventListener("touchend",e=>{
  if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;sx=null;
  if(Math.abs(dx)>40)showPhoto(gi+(dx<0?1:-1));
},{passive:true});
document.addEventListener("click",e=>{
  const t=e.target;
  // Seller-supplied links: warn first, and only open the site if the visitor agrees.
  const ext=t.closest("a[data-ext]");if(ext){
    if(!confirm("Warning: this link leaves ChadAds.\n\nYou are going to "+new URL(ext.href).hostname+", a website we don't control. Only continue if you trust it, and never enter passwords or payment details you aren't sure about.\n\nContinue?"))e.preventDefault();
    return}
  if(t.closest("[data-unvideo]")){pickedVideo=null;showPickedVideo();return}
  const up=t.closest("[data-unpick]");if(up){picked.splice(+up.dataset.unpick,1);showPicked();return}
  const ns=t.closest("[data-nshare]");if(ns){
    const i=items.find(x=>x.id===+ns.dataset.nshare);
    if(i&&navigator.share)navigator.share({title:i.t,text:i.t+" – "+fmt(i.p)+" on ChadAds",url:adUrl(i.id)}).catch(()=>{});return}
  const cp=t.closest("[data-copy]");if(cp){
    const url=adUrl(+cp.dataset.copy);
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject()).catch(()=>{
      const ta=document.createElement("textarea");ta.value=url;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove()
    }).then(()=>{cp.textContent="Copied ✓";setTimeout(()=>{cp.textContent="Copy link"},1800)});return}
  const gn=t.closest("[data-gnav]");if(gn){showPhoto(gi+ +gn.dataset.gnav);return}
  const gt=t.closest("[data-gi]");if(gt){showPhoto(+gt.dataset.gi);return}
  if(t.id==="msgBtn"){t.hidden=true;$("#msg").hidden=false;$("#mt").focus();$("#mt").select();return}
  const sv=t.closest("[data-save]");if(sv){toggleSave(sv.dataset.save);return}
  const od=t.closest("[data-offer]");if(od){offerForm(od.dataset.offer);return}
  const am=t.closest("[data-amt]");if(am){$("#oa").value=am.dataset.amt;ow=false;return}
  const so=t.closest("[data-sendoffer]");if(so){sendOffer(so.dataset.sendoffer);return}
  const pf=t.closest("[data-prof]");if(pf){prof(pf.dataset.prof);return}
  const bk=t.closest("[data-back]");if(bk){open(bk.dataset.back);return}
  const ct=t.closest("[data-city]");if(ct){me=ct.dataset.city;render();return}
  if(t.closest("#locToggle")){showLoc=!showLoc;render();return}
  if(t.id==="geo"){locate();return}
  const vw=t.closest("[data-view]");if(vw){view=vw.dataset.view;render();return}
  const cat=t.closest("[data-cat]");if(cat){cur=cat.dataset.cat;q="";$("#q").value="";render();window.scrollTo({top:0});return}
  const c=t.closest(".card");if(c){open(c.dataset.id);return}
  if(t.closest("[data-close]")){t.closest("dialog").close();return}
  if(t.id==="send"){$("#msg").innerHTML=`<div class="ok">Message sent. The seller will reply by email.</div>`;return}
  if(t.id==="post"){startPost();return}
  const ed=t.closest("[data-edit]");if(ed){startPost(+ed.dataset.edit);return}
  const dl=t.closest("[data-del]");if(dl){deleteAd(+dl.dataset.del);return}
  if(t.tagName==="DIALOG")t.close();
});
document.addEventListener("change",e=>{const t=e.target;if(t.id==="sort")sort=t.value;else if(t.id==="rad")rad=+t.value;else return;render()});
document.addEventListener("input",e=>{const t=e.target;if(t.id==="oa")ow=false;if(t.id==="me"){const k=Object.keys(T).find(n=>n.toLowerCase()===t.value.trim().toLowerCase());if(k&&k!==me){me=k;render()}}});
$("#q").addEventListener("input",e=>{q=e.target.value.trim().toLowerCase();render()});
$("#fl").addEventListener("input",e=>e.target.setCustomValidity(""));
</script>

<script>
/* ---------- Accounts (Supabase Auth) ---------- */
// "sb" is our connection to Supabase, like an ADO connection object in classic ASP.
// Its settings come from config.js.
let sb=null,user=null,signup=false,editId=null,deepDone=false;
const BUCKET="listing-photos",cityIds={};   // cityIds: "Albany, NY" -> the city's id in the database
const PHOTO_TYPES={"image/jpeg":"jpg","image/png":"png","image/webp":"webp"},MAX_PHOTO=5*1024*1024,MAX_PHOTOS=5;   // MAX_PHOTOS must match the limit in step4_photos_and_limits.sql
const cfgOk=typeof NEARBY_CONFIG!=="undefined"&&/^https?:\/\//.test(NEARBY_CONFIG.supabaseUrl)&&!NEARBY_CONFIG.supabaseAnonKey.startsWith("PASTE");
if(cfgOk&&window.supabase)sb=window.supabase.createClient(NEARBY_CONFIG.supabaseUrl,NEARBY_CONFIG.supabaseAnonKey);

// Show or hide the login form's sign-up fields.
function authMode(on){
  signup=on;
  $("#authTitle").textContent=$("#authGo").textContent=on?"Create account":"Log in";
  $("#nameRow").hidden=!on;
  $("#fa").elements.password.autocomplete=on?"new-password":"current-password";
  $("#authSwitch").textContent=on?"Already have an account? Log in":"New here? Create an account";
  $("#authMsg").className="autherr";$("#authMsg").textContent="";
}
// Opens the login pop-up with a short explanation.
function needLogin(text){
  authMode(false);
  $("#authMsg").textContent=sb?text:"Accounts aren't set up yet. Add your Supabase URL and anon key to config.js.";
  $("#dView").close();$("#dAuth").showModal();
}
// Fetch this user's saved ad ids. RLS makes the database return only their own rows.
async function loadFavorites(){
  const {data,error}=await sb.from("favorites").select("listing_id");
  if(error)return;
  saved.clear();data.forEach(r=>saved.add(r.listing_id));
  if(items.length)render();
}
// Update the header to match who is signed in (user is null when signed out).
function showUser(u){
  const changed=(u?u.id:null)!==(user?user.id:null);
  user=u;
  if(changed){
    saved.clear();
    // Wait a tick: Supabase must finish its login work before we ask it for more data.
    if(u)setTimeout(loadFavorites,0);
  }
  $("#auth").textContent=u?"Log out":"Log in";
  $("#who").textContent=u?(u.user_metadata&&u.user_metadata.display_name)||u.email:"";
  if(items.length)render();  // so "your" ads are recognised after logging in or out
}
$("#auth").addEventListener("click",async()=>{
  if(user){await sb.auth.signOut();return}
  authMode(false);
  if(!sb)$("#authMsg").textContent="Accounts aren't set up yet. Add your Supabase URL and anon key to config.js.";
  $("#dAuth").showModal();
});
$("#authSwitch").addEventListener("click",()=>authMode(!signup));
$("#fa").addEventListener("submit",async e=>{
  e.preventDefault();
  const msg=$("#authMsg");msg.className="autherr";msg.textContent="";
  if(!sb){msg.textContent="Accounts aren't set up yet. Add your Supabase URL and anon key to config.js.";return}
  const f=new FormData(e.target),email=String(f.get("email")).trim(),password=String(f.get("password"));
  const go=$("#authGo");go.disabled=true;
  if(signup){
    const name=String(f.get("name")).trim()||email.split("@")[0];
    const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});
    if(error)msg.textContent=error.message;
    else if(!data.session){msg.className="ok";msg.textContent="Almost done! We sent a confirmation link to "+email+". Click it, then come back and log in."}
    else{$("#dAuth").close()}
  }else{
    const {error}=await sb.auth.signInWithPassword({email,password});
    if(error)msg.textContent=error.message;else{e.target.reset();$("#dAuth").close()}
  }
  go.disabled=false;
});
// Runs on page load and every time someone logs in or out.
if(sb)sb.auth.onAuthStateChange((event,session)=>showUser(session?session.user:null));

/* ---------- Post, edit and delete ads ---------- */
// Opens the form: empty for a new ad, or filled in when editing ad number "id".
function startPost(id){
  if(!user){needLogin("Please log in or create an account to post an ad.");return}
  const form=$("#f"),i=id?items.find(x=>x.id===id):null;
  if(id&&!(i&&i.sid===user.id))return;
  editId=i?i.id:null;
  form.reset();$("#postMsg").textContent="";$("#fl").setCustomValidity("");
  picked=[];showPicked();pickedVideo=null;showPickedVideo();
  // When editing: show the video already on the ad; choosing a new file replaces it.
  const cv=$("#curVideo");cv.hidden=!(i&&i.vpath);
  cv.innerHTML=i&&i.vpath?`<span>🎬 This ad has a video</span><label style="flex-direction:row;align-items:center;gap:6px;color:var(--ink)"><input type="checkbox" name="rmv"> Remove</label>`:"";
  $("#videoLbl").textContent=i&&i.vpath?"Replace the video (leave empty to keep it)":"Video clip (optional, MP4, MOV or WebM, up to 50 MB)";
  $("#postTitle").textContent=i?"Edit your ad":"Post an ad";
  $("#postGo").textContent=i?"Save changes":"Publish ad";

  if(i){const e=form.elements;e.t.value=i.t;e.c.value=i.c;e.p.value=i.p;e.loc.value=i.loc;e.d.value=i.d;e.link.value=i.link||"";e.vlink.value=i.vlink||""}
  else $("#fl").value=me;

// The "Link" box only appears when the category is Vehicles.
function showLinkField(){$("#linkRow").hidden=$("#fc").value!=="Vehicles"}
$("#fc").addEventListener("change",showLinkField);
// Only web addresses starting with http:// or https:// are allowed (never javascript: and similar).
function safeUrl(u){try{const x=new URL(u);return x.protocol==="https:"||x.protocol==="http:"?x.href:null}catch(e){return null}}
// Photos the user has chosen so far. Each time they pick more files, the new ones are ADDED
// to this list (the file box itself forgets its previous choice every time).
let picked=[],pickedUrls=[];
function showPicked(){
  pickedUrls.forEach(u=>URL.revokeObjectURL(u));
  pickedUrls=picked.map(f=>URL.createObjectURL(f));
  const box=$("#newPhotos");
  box.hidden=!picked.length;
  box.innerHTML=picked.map((f,n)=>`<label class="rm"><img src="${pickedUrls[n]}" alt=""><button type="button" class="link" data-unpick="${n}">Remove</button></label>`).join("");
}
$("#fimg").addEventListener("change",e=>{
  for(const f of e.target.files)if(!picked.some(p=>p.name===f.name&&p.size===f.size&&p.lastModified===f.lastModified))picked.push(f);
  e.target.value="";   // empty the box so the same file can be chosen again later
  const msg=$("#postMsg");msg.textContent="";
  if(picked.length>MAX_PHOTOS){picked.length=MAX_PHOTOS;msg.textContent="An ad can have up to "+MAX_PHOTOS+" photos. Extra ones were not added."}
  showPicked();
});
// ---- Video ----
// One uploaded clip per ad (the database enforces this too). Chosen file waits here until "Publish".
let pickedVideo=null;
const VIDEO_TYPES={"video/mp4":"mp4","video/quicktime":"mov","video/webm":"webm"},MAX_VIDEO=50*1024*1024,VBUCKET="listing-videos";
function showPickedVideo(){
  const box=$("#newVideo");box.hidden=!pickedVideo;
  box.innerHTML=pickedVideo?`<span>🎬 ${esc(pickedVideo.name)} (${(pickedVideo.size/1048576).toFixed(1)} MB)</span><button type="button" class="link" data-unvideo>Remove</button>`:"";
}
$("#fvid").addEventListener("change",e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  const msg=$("#postMsg");msg.textContent="";
  if(!VIDEO_TYPES[f.type]){msg.textContent="Videos must be MP4, MOV or WebM.";return}
  if(f.size>MAX_VIDEO){msg.textContent="That video is too big ("+(f.size/1048576).toFixed(0)+" MB). The limit is 50 MB, about 30 to 60 seconds from a phone. For longer videos, use a YouTube or Vimeo link.";return}
  pickedVideo=f;showPickedVideo();
});
// Privacy: phones hide the GPS position inside video files, as text like "+43.0830-073.7850/".
// MP4 and MOV files keep that in a small "moov" section. We find it and overwrite every GPS
// position with zeros, without re-encoding, so quality and size stay the same.
// (Other hidden details, such as the phone model or the date, are not removed.)
async function scrubVideo(file){
  if(file.type==="video/webm")return file;
  const size=file.size;let pos=0;
  while(pos+8<=size){
    const h=new DataView(await file.slice(pos,pos+16).arrayBuffer());
    let len=h.getUint32(0),hdr=8;
    const type=String.fromCharCode(h.getUint8(4),h.getUint8(5),h.getUint8(6),h.getUint8(7));
    if(len===1){len=Number(h.getBigUint64(8));hdr=16}else if(len===0)len=size-pos;
    if(len<hdr)break;
    if(type==="moov"){
      if(len>16*1024*1024)throw new Error("This video has an unusual layout and can't be cleaned. Please use a different clip.");
      const moov=new Uint8Array(await file.slice(pos,pos+len).arrayBuffer());
      let s="";for(let k=0;k<moov.length;k+=0x8000)s+=String.fromCharCode.apply(null,moov.subarray(k,k+0x8000));
      const re=/[+-]\d{1,3}\.\d+[+-]\d{1,3}\.\d+(?:[+-]\d+(?:\.\d+)?)?(?:CRS[A-Za-z0-9:_]*)?\//g;
      let m;while((m=re.exec(s))){for(let k=0;k<m[0].length-1;k++){const c=s.charCodeAt(m.index+k);if(c>=48&&c<=57)moov[m.index+k]=48}}   // every digit becomes 0
      return new File([file.slice(0,pos),moov,file.slice(pos+len)],file.name,{type:file.type});
    }
    pos+=len;
  }
  return file;
}
async function uploadVideo(file){
  const clean=await scrubVideo(file);
  const path=user.id+"/"+crypto.randomUUID()+"."+VIDEO_TYPES[file.type];
  const {error}=await sb.storage.from(VBUCKET).upload(path,clean,{contentType:file.type});
  if(error)throw error;
  return path;
}
// Turns a YouTube or Vimeo address into the address of its embedded player (or null if it isn't one).
const VIDEO_LINK_OK=/^https:\/\/(www\.|m\.)?(youtube\.com\/(watch\?v=|shorts\/|embed\/)|youtu\.be\/|vimeo\.com\/)[A-Za-z0-9_?=&\/.-]+$/i;
function videoEmbed(u){
  try{
    if(!u||!VIDEO_LINK_OK.test(u))return null;
    const x=new URL(u),h=x.hostname.replace(/^(www\.|m\.)/,"");let id=null,m;
    if(h==="youtube.com"){id=x.pathname==="/watch"?x.searchParams.get("v"):(m=x.pathname.match(/^\/(?:shorts|embed)\/([\w-]{6,20})/))&&m[1]}
    else if(h==="youtu.be")id=x.pathname.slice(1).split("/")[0];
    if(id&&/^[\w-]{6,20}$/.test(id))return "https://www.youtube-nocookie.com/embed/"+id;
    if(h==="vimeo.com"&&(m=x.pathname.match(/^\/(\d{5,12})(?:\/([a-f0-9]{6,}))?/)))return "https://player.vimeo.com/video/"+m[1]+(m[2]?"?h="+m[2]:"");
  }catch(e){}
  return null;
}
// Privacy: phone photos carry hidden "EXIF" data (GPS location, camera, date).
// Drawing the picture onto a blank canvas and saving it again keeps only the pixels,
// so none of that hidden data is uploaded. It also shrinks big photos to 1600px wide/tall.
async function cleanPhoto(file){
  const MAX=1600;
  const bmp=await createImageBitmap(file,{imageOrientation:"from-image"});  // applies the phone's rotation first
  const s=Math.min(1,MAX/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");
  c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  bmp.close();
  const blob=await new Promise(r=>c.toBlob(r,file.type,0.85));
  if(!blob||!PHOTO_TYPES[blob.type])throw new Error("Couldn't process that photo. Please try a different image.");
  return blob;
}
// Photos go in a folder named after the user's id, so storage rules can check ownership.
async function uploadPhoto(file){
  const blob=await cleanPhoto(file);   // never upload the original file
  const path=user.id+"/"+crypto.randomUUID()+"."+PHOTO_TYPES[blob.type];
  const {error}=await sb.storage.from(BUCKET).upload(path,blob,{contentType:blob.type});
  if(error)throw error;
  return path;
}
$("#f").addEventListener("submit",async e=>{
  e.preventDefault();
  const msg=$("#postMsg");msg.textContent="";
  if(!user){msg.textContent="Please log in first.";return}
  const f=new FormData(e.target),files=picked.slice();
  const loc=Object.keys(T).find(n=>n.toLowerCase()===String(f.get("loc")).trim().toLowerCase());
  if(!loc){$("#fl").setCustomValidity("Choose a city from the list");$("#fl").reportValidity();return}
  // Photos: paths already on this ad, the ones ticked "Remove", and the newly chosen files.
  const have=editId?items.find(x=>x.id===editId).paths:[],removed=f.getAll("rm").filter(p=>have.includes(p));
  if(have.length-removed.length+files.length>MAX_PHOTOS){msg.textContent="An ad can have up to "+MAX_PHOTOS+" photos.";return}
  for(const file of files){
    if(!PHOTO_TYPES[file.type]){msg.textContent="Photos must be JPG, PNG or WebP images.";return}
    if(file.size>MAX_PHOTO){msg.textContent=`"${file.name}" is too big. The limit is 5 MB per photo.`;return}
  }
  const catName=f.get("c");
  // Link: Vehicles only. Any other category saves an empty link.
  const rawLink=catName==="Vehicles"?String(f.get("link")||"").trim():"";
  const link=rawLink?safeUrl(rawLink):null;
  if(rawLink&&(!link||link.length>500)){msg.textContent="The link must be a web address starting with http:// or https:// (500 characters at most).";return}
  // Video link: YouTube or Vimeo only.
  const vlink=String(f.get("vlink")||"").trim();
  if(vlink&&!videoEmbed(vlink)){msg.textContent="The video link must be a YouTube or Vimeo address (starting with https://).";return}
  const row={category_id:cats.find(c=>c[0]===catName)[3],city_id:cityIds[loc],title:String(f.get("t")).trim(),
    description:String(f.get("d")).trim(),price:Math.max(0,Math.round(+f.get("p")||0)),link,video_link:vlink||null};
  // Uploaded video: a new file replaces the old one; ticking "Remove" deletes it.
  const oldVid=editId?items.find(x=>x.id===editId).vpath:null,dropVid=!!oldVid&&(!!pickedVideo||f.get("rmv")!==null);
  const go=$("#postGo");go.disabled=true;
  let newId=null,newPaths=[],removedRows=false,newVid=null,vidRowGone=false;
  try{
    let id=editId;
    if(editId){
      // RLS silently skips rows that aren't yours, so an empty result means "not your ad".
      const {data,error}=await sb.from("listings").update(row).eq("id",editId).select("id");
      if(error)throw error;
      if(!data.length)throw new Error("You can only edit your own ads.");
    }else{
      const {data,error}=await sb.from("listings").insert({...row,seller_id:user.id}).select("id").single();
      if(error)throw error;
      id=newId=data.id;
    }
    // 1. Upload the new files (cleaned of GPS data) one by one.
    for(const file of files)newPaths.push(await uploadPhoto(file));
    // 2. Remove the database rows for photos the user ticked, so the 5-photo limit counts correctly.
    if(removed.length){
      const {error}=await sb.from("listing_photos").delete().eq("listing_id",id).in("storage_path",removed);
      if(error)throw error;
      removedRows=true;
    }
    // 3. Link the new files to the ad.
    if(newPaths.length){
      const {error}=await sb.from("listing_photos").insert(newPaths.map(p=>({listing_id:id,storage_path:p})));
      if(error)throw error;
    }
    // 3b. Video: upload the new clip (GPS removed), unlink the old one, link the new one.
    if(pickedVideo)newVid=await uploadVideo(pickedVideo);
    if(dropVid){
      const {error}=await sb.from("listing_videos").delete().eq("listing_id",id);
      if(error)throw error;
      vidRowGone=true;
    }
    if(newVid){
      const {error}=await sb.from("listing_videos").insert({listing_id:id,storage_path:newVid});
      if(error)throw error;
    }
    // 4. Only now delete the removed files from storage.
    if(removed.length)await sb.storage.from(BUCKET).remove(removed);
    if(dropVid)await sb.storage.from(VBUCKET).remove([oldVid]);
  }catch(err){
    // Undo a half-finished save so nothing is left behind.
    if(newPaths.length)await sb.storage.from(BUCKET).remove(newPaths);
    if(newVid)await sb.storage.from(VBUCKET).remove([newVid]);
    if(vidRowGone)await sb.from("listing_videos").insert({listing_id:editId,storage_path:oldVid});
    if(removedRows)await sb.from("listing_photos").insert(removed.map(p=>({listing_id:editId,storage_path:p})));
    if(newId)await sb.from("listings").delete().eq("id",newId);
    msg.textContent=err.message||"Something went wrong. Please try again.";go.disabled=false;return;
  }
  go.disabled=false;e.target.reset();picked=[];showPicked();pickedVideo=null;showPickedVideo();$("#dPost").close();
  cur=catName;q="";$("#q").value="";sort="new";editId=null;
  await loadData();window.scrollTo({top:0});
});
async function deleteAd(id){
  const i=items.find(x=>x.id===id);
  if(!user||!i||i.sid!==user.id)return;
  if(!confirm("Delete this ad? This can't be undone."))return;
  const {data,error}=await sb.from("listings").delete().eq("id",id).select("id");
  if(error||!data.length){alert(error?error.message:"You can only delete your own ads.");return}
  if(i.paths.length)await sb.storage.from(BUCKET).remove(i.paths);
  if(i.vpath)await sb.storage.from(VBUCKET).remove([i.vpath]);
  $("#dView").close();await loadData();
}

/* ---------- Load categories, cities and listings from the database ---------- */
// Turns "how long ago" into the short text the prototype used: "Just now", "5h", "2d".
const agoText=h=>h<1?"Just now":h<24?h+"h":Math.floor(h/24)+"d";
// Supabase returns at most 1000 rows per request, so a long table is fetched in pages of 1000
// (like paging through a Recordset with PageSize).
async function fetchAll(table,cols){
  const all=[];
  for(let from=0;;from+=1000){
    const {data,error}=await sb.from(table).select(cols).order("id").range(from,from+999);
    if(error)return{error};
    all.push(...data);
    if(data.length<1000)return{data:all};
  }
}
async function loadData(){
  const main=$("#main");
  if(!sb){main.innerHTML=`<div class="empty"><h2>Can't reach the database</h2><p>Add your Supabase URL and anon key to config.js.</p></div>`;return}
  // Three SELECT queries at once, like three Recordsets opened on one connection.
  // The listings query also pulls the seller's name from profiles (a JOIN).
  // "profiles!seller_id" says which link to follow: listings and profiles are
  // also connected through favorites, so Supabase needs to be told.
  const [rc,rt,rl]=await Promise.all([
    sb.from("categories").select("*").order("id"),
    fetchAll("cities","id,name,state,lat,lng"),
    sb.from("listings").select("id,seller_id,category_id,city_id,title,description,price,link,video_link,created_at,profiles!seller_id(display_name,created_at),listing_photos(id,storage_path),listing_videos(id,storage_path)")
      .eq("status","active").order("created_at",{ascending:false}).limit(500)
      .order("id",{referencedTable:"listing_photos"})   // photos in the order they were added
  ]);
  const err=rc.error||rt.error||rl.error;
  if(err){main.innerHTML=`<div class="empty"><h2>Couldn't load listings</h2><p>${esc(err.message)}</p></div>`;return}

  const catById={},cityById={};
  // Hidden categories (active = false) are left out of the menus, the Post form and the listings.
  rc.data.forEach(c=>{catById[c.id]=[c.name,c.icon,HUES[c.name]||200,c.id,c.active!==false]});
  cats=Object.values(catById).filter(r=>r[4]).sort((a,b)=>a[0].localeCompare(b[0]));   // A to Z
  rt.data.forEach(c=>{const k=c.name+", "+c.state;T[k]=[c.lat,c.lng];cityById[c.id]=k;cityIds[k]=c.id});
  if(!T[me])me=Object.keys(T).sort()[0];
  const now=Date.now();
  items=rl.data.filter(r=>catById[r.category_id]&&catById[r.category_id][4]).map(r=>{
    const c=catById[r.category_id],hrs=Math.max(0,Math.floor((now-new Date(r.created_at))/36e5));
    const paths=(r.listing_photos||[]).map(p=>p.storage_path);
    const imgs=paths.map(p=>sb.storage.from(BUCKET).getPublicUrl(p).data.publicUrl),img=imgs[0]||null;
    // Everything shown in the ad's gallery: photos first, then the uploaded video, then a YouTube/Vimeo player.
    const vpath=(r.listing_videos&&r.listing_videos[0])?r.listing_videos[0].storage_path:null;
    const vurl=vpath?sb.storage.from(VBUCKET).getPublicUrl(vpath).data.publicUrl:null,emb=videoEmbed(r.video_link);
    const media=[...imgs.map(u=>({t:"img",u})),...(vurl?[{t:"vid",u:vurl}]:[]),...(emb?[{t:"emb",u:emb}]:[])];
    return{id:r.id,paths,imgs,img,media,vpath,vlink:r.video_link,hasVideo:!!(vurl||emb),link:r.link,t:r.title,p:r.price,c:c[0],loc:cityById[r.city_id],d:r.description,ago:agoText(hrs),hrs,e:c[1],h:c[2],
      sid:r.seller_id,sn:r.profiles&&r.profiles.display_name,sy:r.profiles&&new Date(r.profiles.created_at).getFullYear()}
  }).filter(i=>i.loc);
  // Fill the city suggestions and the category list in the Post form.
  $("#cl").innerHTML=Object.keys(T).sort().map(n=>`<option value="${esc(n)}">`).join("");
  $("#fc").innerHTML=cats.map(c=>`<option>${esc(c[0])}</option>`).join("");
  render();
  // Someone arrived through a shared link like ?ad=26: show that ad straight away.
  if(!deepDone){deepDone=true;const id=+new URLSearchParams(location.search).get("ad");if(id&&items.some(x=>x.id===id))open(id)}
}
loadData();
