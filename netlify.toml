# Netlify settings. Only the "public" folder is published,
# so SQL files, notes and the spec stay private in GitHub.
[build]
  publish = "public"

# Clean addresses for the plain pages: chadads.com/about instead of /about.html
[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/sell"
  to = "/sell.html"
  status = 200

[[redirects]]
  from = "/flyer"
  to = "/flyer.html"
  status = 200

[[redirects]]
  from = "/flyer-sheet"
  to = "/flyer-sheet.html"
  status = 200

# QR codes on printed flyers and cards use these short addresses so visits from each can be counted separately.
[[redirects]]
  from = "/s/flyer"
  to = "/sell.html"
  status = 200

[[redirects]]
  from = "/s/card"
  to = "/sell.html"
  status = 200
